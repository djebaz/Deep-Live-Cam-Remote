[tool.ruff]
target-version = "py310"

# google-colab/*.py are markerized notebook sources (not valid Python: sentinel lines
# such as `"""ENDMARKDOWN`) and the .ipynb files are generated from them by
# scripts/py_to_ipynb.py with byte-exact round-tripping, so they are not linted.
extend-exclude = ["google-colab"]

[tool.ruff.lint]
# Deterministic, low-risk rules enforced in CI. Other rules (F841, E402, F821)
# surface real findings but require human judgement to fix safely, so they are
# left out of the gate for now. Intentional side-effect imports should be
# annotated with `# noqa: F401`.
select = ["E701", "E711", "E712", "F401", "F541"]
