name: Run pytest for PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to test'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch and checkout PR head
        shell: bash
        run: |
          PR_INPUT="${{ inputs.pr_number }}"
          PR="${PR_INPUT%%.*}"

          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: '$PR_INPUT'"
            exit 1
          fi

          echo "Testing PR #$PR"
          git fetch origin "refs/pull/${PR}/head:refs/remotes/origin/pr-${PR}"
          git checkout -q "refs/remotes/origin/pr-${PR}"

      - name: Install system dependencies (libEGL / Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libxkbcommon0 xvfb

      - name: Start Xvfb and set environment
        run: |
          Xvfb :99 -screen 0 1280x1024x24 & sleep 2
          echo "DISPLAY=:99.0" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
          echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest httpx2 python-multipart

      - name: Run tests
        run: pytest -q
